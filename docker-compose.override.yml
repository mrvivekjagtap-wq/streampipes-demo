# Atosu white-label overlay. Compose auto-merges this with docker-compose.yml.
# Bind-mounts branding assets over the stock StreamPipes files inside the ui
# container (nginx serves them as static files) — no image rebuild needed.
# Survives restarts; re-applied automatically by `docker compose up -d`.
#
#   logo.png            -> login-page logo (black, sits on white card)
#   logo-navigation.png -> top-bar logo (white knockout, sits on the coloured bar)
#   favicon-96x96.png   -> browser-tab icon + startup splash mark
services:
  ui:
    volumes:
      - ./branding/logo.png:/usr/share/nginx/html/assets/img/sp/logo.png:ro
      - ./branding/logo-navigation.png:/usr/share/nginx/html/assets/img/sp/logo-navigation.png:ro
      - ./branding/favicon-96x96.png:/usr/share/nginx/html/assets/img/favicon/favicon-96x96.png:ro
