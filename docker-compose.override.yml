# Atosu white-label: build a branded UI image instead of the stock one.
# Bakes in logos, favicon, the <title> and the Atosu theme (navy/maroon/teal).
# Apply:  docker compose up -d --build ui
services:
  ui:
    build:
      context: .
      dockerfile: branding/Dockerfile.ui
    image: atosu/streampipes-ui:0.98.0
