server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }

  # Proxy StreamPipes backend so the HTML is same-origin (no CORS)
  location /sp/ {
    proxy_pass http://ui:8088/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
}
